name: CI

on:
  pull_request:
  push:
    branches: [main]

# On a pull request, one run per ref: a new push cancels the previous run rather
# than paying for two answers to the same question.
#
# On main, one run per COMMIT. The sha is in the group deliberately, so a merge
# commit is alone in its group and can never be superseded. `cancel-in-progress:
# false` is not enough on its own and the previous version of this comment was
# wrong about that: it stops a RUNNING run being cancelled, but GitHub keeps
# only one PENDING run per group and cancels the older one when a new arrival
# queues behind it. On 2026-09-16 three pull requests merged inside two minutes
# and main@59a8714 was cancelled before a single job started — no verdict at
# all, which is precisely what this comment used to promise could not happen.
#
# The condition is written as "not a pull request" rather than "is a push" on
# purpose. Naming the event that GETS isolation means any event added later —
# workflow_dispatch, merge_group — silently opts out of it: those runs would
# share ci-<ref> with cancel-in-progress false, which is this same bug
# reintroduced by an edit that never touches this line. Inverted, a new event
# inherits isolation and has to be deliberately excluded to lose it.
#
# The cost is that two merges landing together both run instead of one. That is
# the price of the guarantee, and a merge commit with no verdict is the thing
# you cannot buy back later — you can re-run it, but only if someone notices.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name != 'pull_request' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest

    # Available for any test that needs a real database. Tests that do not
    # touch it simply ignore DATABASE_URL.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ai_radar
          POSTGRES_PASSWORD: ai_radar
          POSTGRES_DB: ai_radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_radar -d ai_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ai_radar:ai_radar@localhost:5432/ai_radar_test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node and the npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # One source of truth for the Node version, shared with contributors.
          node-version-file: .nvmrc
          cache: npm

      # Node 22 ships npm 10, which cannot read this lockfile: npm 11 omits 27
      # nested entries that npm 10 expects, so it reports "Missing: esbuild@…".
      # The pin stays until the runner's bundled npm reaches 11. The exact
      # version comes from packageManager in package.json, so there is one
      # place to change it and it cannot drift from what contributors install.
      - name: Pin npm to the version in packageManager
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          echo "packageManager pins npm $NPM_VERSION"
          npm install -g "npm@${NPM_VERSION}"
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The failure alarm's decision table, checked on every PR. Its two SILENT
      # cases — still-failing, and an ordinary green run — are the ones no
      # manual test exercises, and a notifier that fires on every run is as
      # broken as one that never fires.
      - name: The ingest alarm decides correctly
        run: node .github/scripts/ingest-alarm.mjs --self-test

      # The migration gate's classifier, on every PR. Its acceptance test is
      # this repository's own history: 0004 (two ADD COLUMNs) must classify
      # additive — that is the migration whose absence caused the four-day
      # outage — and 0003 (an UPDATE that erases diagnostics) must NOT, because
      # auto-applying it would have destroyed the evidence for that outage.
      - name: The migration gate classifies correctly
        run: node scripts/migration-gate.mjs --self-test

      # `typecheck` is `next typegen && tsc --noEmit`. The typegen half is not
      # decoration: LayoutProps and friends live in gitignored .next/types, so a
      # clean checkout cannot typecheck without it.
      - name: Typecheck
        run: npm run typecheck

      # The journal decides what runs, and every bad resolution of a migration
      # collision is silent at the moment it is made. On a pull request this
      # also compares against the BASE branch, which is the only place a
      # cross-branch timestamp collision is visible — neither branch can see
      # the other's `when`, the merge result sees both.
      - name: Migration journal
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin \
              "+refs/heads/$BASE:refs/remotes/origin/$BASE"
            npm run migrations:check -- "origin/$BASE"
          else
            npm run migrations:check
          fi

      # ADDED WITH #106. The guard rule used to live in a vitest file, so `npm
      # test` enforced it. Folding it into this script would have removed it
      # from CI entirely, because routes:check was never wired in — the rule
      # would have been better implemented and no longer checked.
      - name: Route cost and guard rules
        run: npm run routes:check

      - name: Unit tests
        run: npm test

      # Built with no DATABASE_URL on purpose. `next build` imports every route
      # module to collect its page data, and src/db/client.ts throws without a
      # connection string, so a route that imports the client at the top of the
      # file fails any build that has no database — which is exactly what the
      # image build is. Catching it here costs seconds; the image build catches
      # it two minutes in, and only compose-smoke runs that.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ""

      # Last on purpose: a formatting nit must never be the reason a real
      # failure goes unseen.
      - name: Format check
        run: npm run format:check

  # The browser evidence. Three scripts in this repo measure things no other
  # check can see — and until this job existed, all of them ran only when a
  # person remembered, which means they were absent exactly when nobody was
  # looking.
  #
  # Runs on every pull request rather than on a path filter. A path filter would
  # have to guess which files can change a rendered page, and the honest answer
  # is most of them: a utility, a token, a layout, a dependency bump. A browser
  # check that runs only sometimes is the problem this job exists to fix. It
  # costs 118 seconds, measured on run 35166985867 rather than estimated —
  # containers 21s, install 17s, build 21s, the sweep 34s, the shell checks 8s.
  # (An earlier version of this comment said 3-4 minutes, which was a guess and
  # was nearly double.) The schedule in ingest.yml is where the minutes
  # conversation actually belongs (see docs/cost-protection.md).
  #
  # `needs: ci` so a pull request that already fails lint, types, tests or the
  # build does not also pay for a browser.
  e2e:
    name: browser checks
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ai_radar
          POSTGRES_PASSWORD: ai_radar
          POSTGRES_DB: ai_radar_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_radar -d ai_radar_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ai_radar:ai_radar@localhost:5432/ai_radar_e2e
      NEXT_TELEMETRY_DISABLED: "1"
      # The one place the server's URL is written. It reaches both scripts as
      # argv[2] (see .github/scripts/run-browser-check.sh), which is what makes
      # it bind both rather than only the one that also reads the variable.
      VERIFY_URL: http://127.0.0.1:3210

    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node and the npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm to the version in packageManager
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      # No browser download. `playwright-core` ships none by design, and the
      # runner image already carries Google Chrome, which is what
      # scripts/lib/browser.mjs resolves through Playwright's "chrome" channel.
      # Printed rather than assumed: if this ever prints nothing, the scripts
      # below exit 2 and this job goes red saying the instrument could not run,
      # which is the correct outcome and not a skip.
      - name: Show the browser the scripts will drive
        run: |
          google-chrome --version || echo "no google-chrome on PATH"

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ""

      - name: Create the schema and load the catalogue
        run: |
          npm run db:migrate
          npm run db:seed

      # A production server, because that is what the scripts measure: the
      # service worker, the theme-colour meta and the bundled CSS all behave
      # differently under `next dev`.
      - name: Start the production server
        run: |
          npx next start -p 3210 > /tmp/next-server.log 2>&1 &
          echo $! > /tmp/next-server.pid
          for i in $(seq 1 60); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3210/ || true)"
            if [ "$CODE" = "200" ]; then echo "server answered 200 after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "the server never answered 200; last code was '${CODE:-none}'" >&2
          cat /tmp/next-server.log >&2
          exit 1

      # THE REACHABLE-BUT-EMPTY STATE, EXERCISED HERE AND NOWHERE ELSE.
      #
      # Today has three states and two of them must never look alike: a quiet
      # morning (the database answered and nothing arrived) and an unreachable
      # database (we do not know what happened). The browser checks below need
      # stories, so the step after this one seeds them — which means this is the
      # only moment in the whole run when the database is reachable and empty.
      #
      # So the empty case is asserted HERE, before the seed, with curl rather
      # than a browser: the state names itself in the DOM, so no interaction is
      # needed to read it. Without this step, seeding would quietly retire a
      # state the product deliberately distinguishes.
      - name: A reachable, empty database is a quiet day, not a failure
        run: |
          HTML="$(curl -s http://127.0.0.1:3210/)"
          STATE="$(printf '%s' "$HTML" | grep -o 'data-screen-state="[a-z]*"' | head -1)"
          echo "state before seeding: ${STATE:-<none>}"
          if [ "$STATE" != 'data-screen-state="quiet"' ]; then
            echo "an empty database rendered ${STATE:-no state at all}, not the quiet state" >&2
            printf '%s' "$HTML" | grep -oiE "cannot reach your stories|quiet (morning|day)" >&2 || true
            exit 1
          fi
          # The reader was told SOMETHING, not only the marker: a reader never
          # sees the marker.
          #
          # THIS DELIBERATELY ASSERTS NOTHING ABOUT THE WORDS. Two earlier
          # versions pinned a wording and both reddened on a page that was
          # behaving perfectly: first "quiet morning", which #102's copy changed
          # to "a quiet day", then "quiet (morning|day)", which was a wider pin
          # and still a pin — its own comment claimed "in whichever words suit
          # them" while the pattern said otherwise, which is worse, because the
          # comment tells the next person the check is safe to edit around.
          #
          # The property that actually matters is that the empty state rendered
          # an EXPLANATION at all. A screen that shows the marker and no prose
          # is the defect; a rewritten sentence is not. So: find the block, take
          # its body, and require it to be long enough to be an explanation.
          # MATCHES THE REAL ATTRIBUTE, NOT ITS ESCAPED TWIN. A Next.js document
          # carries the page TWICE: once as DOM HTML, and once as the RSC flight
          # payload, JSON-escaped inside a script tag. So `data-empty-body`
          # occurs twice, and the payload copy — data-empty-body\":\"true\" —
          # comes first. A `head -1` over a loose pattern reads the payload,
          # runs [^>]* to some unrelated bracket, and captures nothing.
          #
          # That cost three CI rounds and two wrong hypotheses, both of mine, so
          # it is written here rather than left as a clever pattern: requiring
          # the literal `="true"` cannot match the escaped form, because that
          # one has \":\" between the name and the value.
          #
          # ─────────────────────────────────────────────────────────────────
          # THE RULE, FOR WHOEVER ADDS THE NEXT `curl … | grep` STEP (#115).
          # It lives here, beside the only assertion in this repository that
          # reads an HTML body, because that is where it will be met.
          #
          # The first version of this note said the hazard applied to "every
          # curl-and-grep assertion". That is a CAUTION, not a finding, and the
          # population was then measured: three curl sites read STATUS only,
          # ONE reads an HTML body (this one), one reads JSON from /api/brief,
          # and every scripts/*.mjs asserts through Playwright DOM locators,
          # which query the PARSED document and can never see the payload.
          # A class is a caution; two conditions and a population is a check.
          #
          # EXPOSED ONLY IF BOTH ARE TRUE:
          #   1. first-match (`head -1`) over a pattern that CAN match the
          #      escaped form — anything containing `="` cannot, because the
          #      payload writes \":\" between name and value; AND
          #   2. a POSITIVE assertion. A negative one ("must NOT contain") can
          #      only over-fire on the second copy: loud, never a silent pass.
          #
          # Both surviving patterns here are safe by that test, and neither by
          # accident: the data-screen-state check is first-match over a loose
          # pattern but requires `="`; the "cannot reach your stories" grep
          # matches both copies but is negative.
          #
          # TWO MORE FORMS OF THE SAME DEFECT:
          #
          #   COUNTS ARE DOUBLED. Every element appears once in the DOM and
          #   once in the payload, so a count from fetched HTML is twice the
          #   truth — and two equally doubled counts COMPARE FINE, so a ratio
          #   or a difference survives the doubling with nothing in the output
          #   saying the units are wrong. A floor like `>= 1` is satisfiable by
          #   the payload copy alone, so a page rendering ZERO can clear it.
          #   Do not count from fetched HTML: read the JSON API, which has one
          #   representation. The view-split step below does exactly that, and
          #   says so.
          #
          #   ANY DOCUMENT THAT QUOTES ITSELF has this shape. A job log carries
          #   the step's INSTRUCTIONS as well as its OUTPUT, so `grep -c 'NOTE:'`
          #   returned 1 on a run that emitted zero — the hit was this file's
          #   own `echo`. Before grepping a document for evidence of what it
          #   DID, ask whether it also contains what it was TOLD to do. Anchor
          #   to something only the executed copy carries: a timestamp prefix
          #   in a log, the literal `="true"` here. A hit with no such anchor
          #   is unclassified, not evidence.
          # ─────────────────────────────────────────────────────────────────
          EXPLANATION="$(printf '%s' "$HTML" | tr -d '\n' \
            | grep -o 'data-empty-body="true"[^>]*>[^<]*' | head -1 | sed 's/.*>//')"
          if [ "${#EXPLANATION}" -lt 60 ]; then
            echo "state=quiet but the screen explained itself in ${#EXPLANATION} characters" >&2
            echo "  found: ${EXPLANATION:-<no empty-state body at all>}" >&2
            # DIAGNOSTICS, because two rounds were spent guessing at this from
            # a length alone. A failure that cannot say WHY costs a full CI
            # round per hypothesis; these four lines cost nothing and end it.
            echo "  --- diagnostics ---" >&2
            echo "  html bytes: ${#HTML}" >&2
            # grep -c counts LINES, and this HTML is one line — so it answers
            # "at least once" for anything, which is not the question. -o | wc -l
            # counts occurrences.
            #
            # THESE COUNTS ARE DOUBLED AND THE LABEL SAYS SO. They are the only
            # counts taken from fetched HTML in this repository, and they are
            # diagnostics rather than assertions — nothing branches on them. But
            # an unlabelled "2" here reads as "two elements" when it means one
            # element and its escaped twin, and a reader debugging at speed is
            # exactly who would halve nothing and conclude wrongly.
            echo "  occurrences of 'data-empty' (DOM + payload, so ~2x): $(printf '%s' "$HTML" | grep -o 'data-empty' | wc -l | tr -d ' ')" >&2
            echo "  occurrences of 'data-empty-body' (DOM + payload, so ~2x): $(printf '%s' "$HTML" | grep -o 'data-empty-body' | wc -l | tr -d ' ')" >&2
            echo "  the empty-state markup as rendered:" >&2
            printf '%s' "$HTML" | tr -d '\n' | grep -o 'data-empty.\{0,500\}' | head -1 | sed 's/^/    /' >&2
            echo "  DO NOT lower this threshold to make this pass. It is red because" >&2
            echo "  the empty screen stopped telling the reader what happened, which" >&2
            echo "  is the one thing this state exists to do. Fix the page." >&2
            exit 1
          fi
          echo "the empty state explained itself in ${#EXPLANATION} characters"
          # And the half that actually matters: a quiet day must never be
          # described as a failure. This is the pair the product exists to keep
          # apart, and it is the assertion that would catch them being confused.
          if printf '%s' "$HTML" | grep -qi "cannot reach your stories"; then
            echo "state=quiet but the screen says it cannot reach the stories" >&2
            exit 1
          fi

      # THE CONTROL FOR THE STEP ABOVE (#115), and without it "we fixed the
      # pattern" is untested.
      #
      # The fix claims the production pattern cannot be satisfied by the escaped
      # payload copy. The proof is that on a document containing BOTH copies it
      # matches the DOM one and ONLY the DOM one — so the count it finds must
      # equal the number of real elements, not the number of occurrences of the
      # attribute name.
      #
      # THE FLOOR IS WHAT MAKES THAT A CONTROL. If the escaped copy is not in
      # the document, the pattern has nothing to be fooled by and matching once
      # proves nothing. So the step first requires the name to appear MORE times
      # than the DOM form does — that difference IS the second copy, measured
      # rather than assumed.
      #
      # An earlier version fetched the flight payload alone with an `RSC: 1`
      # header, on the theory that a payload-only document was the cleaner
      # subject. That request returned ZERO BYTES, the floor said so, and the
      # theory was wrong — which is why the floor prints what it received. This
      # version needs no special request: the ordinary page already carries both
      # copies, which is the whole problem and therefore the ideal subject.
      - name: CONTROL — the empty-state pattern matches the DOM copy and not its escaped twin
        run: |
          set -euo pipefail
          DOC="$(curl -s http://127.0.0.1:3210/)"
          echo "document bytes: ${#DOC}"

          # Every grep carries `|| true`. Under `set -euo pipefail` a grep that
          # matches nothing exits 1 and the step dies THERE, before the floor
          # written to explain it — which is how the first run of this control
          # failed with no message at all. A floor that cannot speak reports as
          # the failure it exists to describe.
          NAME="$(printf '%s' "$DOC" | grep -o 'data-empty-body' | wc -l | tr -d ' ' || true)"
          DOMF="$(printf '%s' "$DOC" | grep -o 'data-empty-body="true"' | wc -l | tr -d ' ' || true)"
          NAME="${NAME:-0}"; DOMF="${DOMF:-0}"
          echo "occurrences of the attribute NAME: $NAME    of the DOM form: $DOMF"

          if [ "$DOMF" -lt 1 ]; then
            echo "::error::the page carries no DOM form of data-empty-body at all ($NAME name occurrence(s)), so this control exercised nothing. Fix the setup; do not delete the control." >&2
            exit 1
          fi
          if [ "$NAME" -le "$DOMF" ]; then
            echo "::error::the attribute name appears $NAME time(s) and the DOM form $DOMF — there is NO second copy in this document, so the pattern had nothing to be fooled by and matching it proves nothing. If Next has stopped embedding the RSC payload, this control needs rewriting rather than deleting." >&2
            exit 1
          fi

          # THE ASSERTION. The production pattern must match exactly the DOM
          # occurrences — never the extra ones, which are the escaped copy.
          HITS="$(printf '%s' "$DOC" | tr -d '\n' | grep -o 'data-empty-body="true"[^>]*>[^<]*' | wc -l | tr -d ' ' || true)"
          HITS="${HITS:-0}"
          if [ "$HITS" -ne "$DOMF" ]; then
            echo "::error::the pattern matched $HITS time(s) against $DOMF real element(s) — it is reading the escaped copy, which is the defect this rule exists to prevent." >&2
            exit 1
          fi
          echo "RESULT: the attribute name appears $NAME times, the DOM form $DOMF, and the pattern matched $DOMF — it discriminated against $(( NAME - DOMF )) escaped occurrence(s)."

      # Stories, through the REAL pipeline rather than inserted rows, because a
      # story that never went through it has no sources, no clustering and no
      # score — the browser checks would exercise the SELECT and nothing else.
      # The script carries its own floor and fails if it seeds too few, so an
      # empty seed cannot be discovered later by whatever runs next.
      - name: Seed stories for the browser checks
        run: npm run db:seed:stories

      # THE ACCEPTANCE OF #102, ASSERTED RATHER THAN PHOTOGRAPHED.
      #
      # "One feed, one filter" is only true if the two positions return
      # DIFFERENT SETS. #108 carries a screenshot pair, and a screenshot proves
      # that ONCE, on whatever corpus that machine happened to hold — the same
      # pair refused to be taken at all on a dev database whose stories were
      # every one of them a RELEASE. This proves it on every run, against rows
      # the real pipeline wrote.
      #
      # THROUGH THE JSON API AND NOT THE PAGE, and this is the reason rather
      # than a preference. A Next.js document carries the page TWICE: the DOM
      # HTML and the RSC flight payload, JSON-escaped in a script tag. Counting
      # `<article` in that HTML counts both copies — and TWO EQUALLY DOUBLED
      # NUMBERS COMPARE FINE while measuring something other than what you
      # think. #115 owns sweeping the checks that already do this; this one is
      # written not to need sweeping.
      - name: The two view positions return different sets
        run: |
          set -euo pipefail
          read_count() {
            curl -s "http://127.0.0.1:3210/api/brief?view=$1&length=all" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                  const b=JSON.parse(s);
                  const types=[...new Set(b.stories.map(x=>x.contentType))].sort().join(",");
                  console.log(`${b.count} ${types}`);
                })'
          }
          BUILT="$(read_count built)"; ALL="$(read_count all)"
          built="${BUILT%% *}"; all="${ALL%% *}"
          echo "MEASURED: view=built -> $built  [${BUILT#* }]"
          echo "MEASURED: view=all   -> $all  [${ALL#* }]"

          # THE FLOOR, AND IT COMES FIRST so the error text can tell the two
          # causes apart. Two empty sets are not "different", and 0 < 0 is
          # false, so an empty corpus would otherwise fail the assertion below
          # and read exactly like a broken filter.
          if [ "$built" -lt 1 ] || [ "$all" -lt 1 ]; then
            echo "::error::one or both positions returned nothing (built=$built all=$all) — this is the SEED, not the filter" >&2
            exit 1
          fi
          if [ "$built" -ge "$all" ]; then
            echo "::error::both positions returned the same set (built=$built all=$all). Either the filter is not filtering, or the seeded corpus contains only built things — check the content types above before touching the filter." >&2
            exit 1
          fi
          echo "RESULT: the two positions return different sets ($built built of $all total)."

      # Both checks go through one wrapper, which owns the exit-code contract:
      # 0 passed, 1 the checks ran and failed, 2 the instrument could not run.
      # Its reasoning lives in the file. Two callers, one copy — a control can
      # only ever exercise one caller, so two copies would drift.
      #
      # The URL is passed as an argument, not left to the environment:
      # verify-shell.mjs reads argv[2] || VERIFY_URL, a11y-audit.mjs reads
      # argv[2] only, so argv is the one input that binds both to this server.
      # EVERY browser check, DERIVED from package.json rather than listed here.
      #
      # #83 exists because this step was a LIST and two scripts were left off
      # it: verify:today had never run in CI and verify:saved followed it, so
      # the behaviours of #16 and the Today screen were guarded by files nobody
      # ran automatically. Fixing an enumeration bug by writing a longer
      # enumeration is the defect wearing a fix's clothes, so the list is gone.
      #
      # THE CONVENTION IS THE OPT-IN: a script named `verify:*`, plus `a11y`.
      # A lane adding `verify:whatever` is in CI the day it lands, with no edit
      # here and nobody remembering; a lane adding an unrelated script is not
      # silently conscripted. That is the payoff and it is not hypothetical —
      # #65 adds `verify:isolation`, which joins this job the hour it merges.
      #
      # WHAT MAKES A SCRIPT ELIGIBLE, so the next person adding one does not
      # have to guess. The prefix IS the declaration. Naming a script `verify:`
      # says "this asserts a behaviour and a failure means the product is
      # wrong"; naming it anything else says it is not that. The author of the
      # script declares, not this file — which is the whole point of deriving
      # rather than listing, and it is why the answer is a rule and not a set
      # of exceptions.
      #
      # WORKED CASE, because it is the first real one and it arrives with #108:
      # `shots:filter` (scripts/shoot-filter.mjs) has floors, refuses to write
      # its files when two views return the same count, and CAN fail. It is
      # still NOT picked up here, and the reason is not that it is unimportant.
      # A verification script passing means a behaviour holds. A capture script
      # passing means files were written — and nothing in this job consumes
      # them, so a pass would assert nothing a reader could act on.
      #
      # If the UI lane wants those floors enforced in CI, the fix is on its
      # side and is one line: name the assertions `verify:something`, or add a
      # `verify:` wrapper around them. THAT IS A DELIBERATE ACT BY THE SCRIPT'S
      # OWNER, which is better than this file deciding on their behalf — and
      # better than a maintainer here having to know what every prefix means.
      #
      # WHAT THESE CURRENTLY MEASURE, because it will change under someone and
      # they should not have to work out why. NEXT_PUBLIC_USE_FIXTURES is set
      # nowhere, and src/lib/api/client.ts reads `!== "0"`, so THE APP SERVES
      # FIXTURES HERE and verify:today's story-count floor passes on fixture
      # cards. #65 inverts that default in code (`=== "1"`) and adds a
      # `db:seed:stories` step to this same job in the same commit, so the
      # transition is atomic and both states are green. IF A LATER CHANGE MOVES
      # THAT SEEDER, SPLITS THIS JOB, OR ADDS A SECOND JOB RUNNING THESE
      # SCRIPTS WITHOUT SEEDING, THEY WILL GO RED FOR A REASON THAT IS NEITHER
      # SCRIPT'S FAULT.
      - name: Every browser check, derived from package.json
        run: |
          set -euo pipefail

          # Printed before anything runs, so a reader sees what was SELECTED
          # rather than inferring it from what happened to pass.
          CHECKS="$(node -e '
            const s = require("./package.json").scripts;
            const picked = Object.keys(s).filter((k) => k === "a11y" || k.startsWith("verify:")).sort();
            console.log(picked.join("\n"));
          ')"
          echo "Derived from package.json — the convention is \`verify:*\` plus \`a11y\`:"
          echo "$CHECKS" | sed 's/^/  /'

          # THE FLOOR. A derived list that derives nothing runs nothing and
          # exits 0 — the exact failure #83 is about, reproduced inside its own
          # fix. Two, not one: the partial break is the glob matching a subset
          # after a rename, and a floor of 1 is blind to it. Measured
          # 2026-09-17 at d8ec412: a11y, verify:saved, verify:shell,
          # verify:today.
          COUNT="$(printf '%s\n' "$CHECKS" | grep -c . || true)"
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::derived only $COUNT browser check(s) from package.json; the naming convention or the script names have changed and this job would have run almost nothing" >&2
            exit 1
          fi
          echo "RESULT: $COUNT browser checks derived."

          # THE CLOSURE, because the convention REDUCES the class rather than
          # closing it. A naming convention turns "remember to edit a list"
          # into "remember to use a prefix" — much better, one word at
          # authoring time — but a lane naming its script `check:foo` is
          # silently out of CI exactly as verify:today was, and the count floor
          # above catches a MASS failure, not a single omission.
          #
          # So: every script that drives a browser must be SELECTED, or
          # DECLARED here as not a check. `launchBrowser` from
          # scripts/lib/browser.mjs is the thing a browser check cannot avoid
          # importing, so it is the independent source of truth the naming
          # convention can be measured against. Measured 2026-09-18 at bdd76ca:
          # the set of importers is EXACTLY the four selected, no more and no
          # less.
          #
          # This does not eliminate the enumeration, it SHRINKS it and changes
          # what forgetting costs: an unlisted, unselected browser script makes
          # the job LOUD instead of quiet. The author still declares; the floor
          # only makes an ABSENCE of declaration audible. #108's
          # shoot-filter.mjs will import launchBrowser and is deliberately not
          # a check, so it adds one line here when it lands — deciding rather
          # than forgetting.
          # DECIDED, not forgotten — this is the line the comment above predicted.
          #
          # shoot-filter.mjs drives a browser and is NOT a check: it captures the
          # screenshots for #102's two filter positions. It asserts plenty before
          # each shutter (route, screen state, the control's own position) and
          # refuses to write files when the two views return the same count, but
          # those assertions guard the PICTURES, not the product. Running it here
          # would also make CI depend on a corpus that differs by view, which is
          # a property of the seed rather than of the app.
          NOT_A_CHECK="scripts/shoot-filter.mjs"

          DRIVERS="$(grep -rl "launchBrowser" scripts --include='*.mjs' 2>/dev/null | grep -v '^scripts/lib/' | sort || true)"
          SELECTED_FILES="$(while IFS= read -r c; do
            [ -n "$c" ] || continue
            node -e 'const s=require("./package.json").scripts[process.argv[1]]||"";
              const m=s.match(/scripts\/[A-Za-z0-9._-]+/); if (m) console.log(m[0]);' "$c"
          done <<< "$CHECKS" | sort)"

          UNCLAIMED=""
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            printf '%s\n' "$SELECTED_FILES" | grep -qx "$d" && continue
            printf '%s\n' "$NOT_A_CHECK" | grep -qx "$d" && continue
            UNCLAIMED="$UNCLAIMED $d"
          done <<< "$DRIVERS"

          if [ -n "$UNCLAIMED" ]; then
            echo "::error::these scripts drive a browser but are neither selected by the naming convention nor declared as non-checks:$UNCLAIMED — rename to verify:* to run them in CI, or add them to NOT_A_CHECK with a reason" >&2
            exit 1
          fi
          echo "RESULT: every browser-driving script is accounted for ($(printf '%s\n' "$DRIVERS" | grep -c . || true) found)." 

          # THE CONTROLS, run before the checks themselves.
          #
          # #83's acceptance: "a script added to CI without its control being
          # exercised there is a green check nobody has tested." A check that
          # has never been observed failing is an unreported unknown, not a
          # pass.
          #
          # The map is explicit because a control's VALUE ("narrow",
          # "skip-seed") is a script-specific fact this file cannot derive. But
          # the map is FLOORED against a derived set: every selected script is
          # grepped for `process.env.*_CONTROL`, and a script that declares one
          # this map does not exercise FAILS THE JOB. So the enumeration cannot
          # silently go stale — adding a control to a script demands it be
          # exercised here, which is the property a bare list would not have.
          #
          # THAT GAP IS NOW CLOSED. This comment used to say verify:today and
          # verify:shell declared no control, so nothing here proved they could
          # fail — half of what this job runs. #113 closed it in their author's
          # own scripts, which is where it had to happen: this file could name
          # the gap but must not invent a control by editing another lane's
          # code, because a control's mechanism is a script-specific fact.
          #
          # The floor below is what made that self-enforcing rather than
          # remembered. The moment those two scripts declared a control, the
          # job began FAILING until this map exercised it.
          #
          # verify:isolation joined this map when its script was added, which is
          # the floor below working as designed: it declared VERIFY_CONTROL and
          # this job refused to run until the control was exercised. Adding it
          # also surfaced that the script's exit code was INVERTED against this
          # contract — it exited 0 when its floor went red and 1 when it stayed
          # green, so this loop would have read a BROKEN control as "failed as
          # it must". The script was corrected rather than this map relaxed.
          declare -A CONTROL_ENV=(
            [a11y]="AUDIT_CONTROL=narrow"
            [verify:saved]="VERIFY_CONTROL=skip-seed"
            [verify:isolation]="VERIFY_CONTROL=shared-identity"
            [verify:today]="VERIFY_CONTROL=no-budget"
            [verify:shell]="VERIFY_CONTROL=no-service-worker"
          )

          while IFS= read -r check; do
            [ -n "$check" ] || continue
            FILE="$(node -e 'const s=require("./package.json").scripts[process.argv[1]]||"";
              const m=s.match(/scripts\/[A-Za-z0-9._-]+/); console.log(m?m[0]:"");' "$check")"
            [ -n "$FILE" ] || continue
            # `|| true` is load-bearing: grep exits 1 when it finds NOTHING,
            # which is the ORDINARY case here — a script with no control. Under
            # `set -euo pipefail` that non-match aborts the whole step, which is
            # exactly what CI caught on the first run: both controls passed and
            # then the job died on verify:shell for having none. Grep's exit
            # status is a RESULT, not an error.
            DECLARED="$(grep -oE 'process\.env\.[A-Z_]+_CONTROL' "$FILE" | sed 's/process\.env\.//' | sort -u || true)"
            # SAID OUT LOUD rather than skipped. This loop's floor bounds what
            # was DECLARED, not what SHOULD have been — a script with no
            # control is invisible to it, which is the registry-test shape this
            # job exists to argue against, sitting in the job itself. The job
            # cannot know a control is missing; it can refuse to be quiet about
            # it. #113 owns closing the gap.
            if [ -z "$DECLARED" ]; then
              echo "NOTE: $check declares no control, so nothing here proves it can fail (#113)."
              continue
            fi
            MAPPED="${CONTROL_ENV[$check]:-}"
            if [ -z "$MAPPED" ]; then
              echo "::error::$check declares $DECLARED but this job exercises no control for it — a check nobody has seen fail is an unreported unknown" >&2
              exit 1
            fi
            # The name the SCRIPT reads must be the name this job SETS. Without
            # this, renaming AUDIT_CONTROL while keeping its value leaves the
            # job setting a variable nothing reads: the control then "fails"
            # because the script ran normally and its floor happened to hold,
            # and the red would point at the floor rather than at the rename.
            if [ "$DECLARED" != "${MAPPED%%=*}" ]; then
              echo "::error::$check reads \$$DECLARED but this job sets ${MAPPED%%=*}; the control is a variable the script ignores" >&2
              exit 1
            fi
            # The value must still exist in the script, or the control is a
            # string this job believes in and the script ignores.
            VALUE="${MAPPED#*=}"
            grep -q "\"$VALUE\"" "$FILE" || {
              echo "::error::$check's control value '$VALUE' no longer appears in $FILE" >&2; exit 1; }

            echo "::group::CONTROL $check ($MAPPED) — must FAIL"
            set +e
            env "$MAPPED" npm run "$check" -- "$VERIFY_URL" > /tmp/control.log 2>&1
            CC=$?
            set -e
            tail -20 /tmp/control.log
            # EXACTLY 1, not merely non-zero. run-browser-check.sh defines the
            # contract three lines below this loop and says why: 0 passed, 1
            # the checks RAN and FAILED, 2 THE INSTRUMENT COULD NOT RUN — "non-
            # zero for a reason that looks environmental rather than like a
            # defect". This loop bypasses that wrapper, so accepting any
            # non-zero would let a control that died with NO BROWSER RESOLVED
            # print "failed as it must" — asserting a floor was seen going red
            # on a run where the script never started. That is a vacuous
            # instrument inside the mechanism built to detect vacuous
            # instruments.
            if [ "$CC" -eq 0 ]; then
              echo "::error::$check PASSED under $MAPPED. Its floor cannot fail, so its green tells you nothing." >&2
              exit 1
            fi
            if [ "$CC" -eq 2 ]; then
              echo "::error::$check exited 2 under $MAPPED — THE INSTRUMENT COULD NOT RUN (no browser, or nothing serving $VERIFY_URL). That is not the floor failing and it proves nothing about the control." >&2
              exit 1
            fi
            if [ "$CC" -ne 1 ]; then
              echo "::error::$check exited $CC under $MAPPED, which is neither a pass (0), a failed check (1) nor an unusable instrument (2). The exit-code contract has changed." >&2
              exit 1
            fi
            echo "RESULT: $check failed under $MAPPED as it must (exit 1 — the checks ran and the floor failed)."
            echo "::endgroup::"
          done <<< "$CHECKS"

          # Each through the one wrapper, which owns the exit-code contract:
          # 0 passed, 1 ran and failed, 2 the instrument could not run. The
          # wrapper also refuses a check that exits 0 having measured nothing.
          while IFS= read -r check; do
            [ -n "$check" ] || continue
            echo "::group::$check"
            bash .github/scripts/run-browser-check.sh "$check" "$check" "$VERIFY_URL"
            echo "::endgroup::"
          done <<< "$CHECKS"

      - name: Server log, if anything above failed
        if: failure()
        run: cat /tmp/next-server.log || true

      - name: Stop the server
        if: always()
        run: |
          [ -f /tmp/next-server.pid ] && kill "$(cat /tmp/next-server.pid)" 2>/dev/null || true

  # Proves the self-host path the README promises. The owner's Mac has no
  # Docker, so this job is the only place the image and the stack are ever
  # actually run.
  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    # A stack that never becomes healthy would otherwise sit here burning
    # minutes on a free-tier budget.
    timeout-minutes: 15

    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The quick start's first commands. If .env.example's defaults have drifted
      # out of step with the compose file, the stack fails here.
      #
      # The generated secret is part of the quick start, not a CI convenience:
      # since issue #5 the worker refuses to start while INTERNAL_API_SECRET is
      # the published placeholder, so a smoke that kept the placeholder would
      # test a path the README no longer tells anyone to take.
      - name: cp .env.example .env, then generate a real secret
        run: |
          cp .env.example .env
          sed -i "s|^INTERNAL_API_SECRET=.*|INTERNAL_API_SECRET=$(openssl rand -hex 32)|" .env
          # Assert what the value IS, not merely that it is not the placeholder:
          # if the sed ever matched nothing — a renamed key, a reordered
          # .env.example — the line would be absent entirely and a "not
          # change-me" check would pass on a file with no secret at all.
          if ! grep -qE '^INTERNAL_API_SECRET=[0-9a-f]{64}$' .env; then
            echo "INTERNAL_API_SECRET is not a 64-character hex secret; the worker would refuse to start" >&2
            grep -n '^INTERNAL_API_SECRET=' .env >&2 || echo "  (no INTERNAL_API_SECRET line at all)" >&2
            exit 1
          fi
          echo "INTERNAL_API_SECRET generated for the smoke"

      - name: Build the image
        run: docker compose build web

      - name: Report the image size
        run: |
          BYTES="$(docker image inspect ai-radar:local --format '{{.Size}}')"
          echo "image ai-radar:local = $((BYTES / 1024 / 1024)) MB ($BYTES bytes)"
          echo "IMAGE_MB=$((BYTES / 1024 / 1024))" >> "$GITHUB_ENV"

      - name: Boot postgres and web
        run: docker compose up -d --wait --wait-timeout 180 postgres web

      - name: Wait for web to answer 200
        run: |
          set -eu
          for i in $(seq 1 60); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)"
            if [ "$CODE" = "200" ]; then
              echo "web answered HTTP $CODE after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "web never answered 200; last code was '${CODE:-none}'" >&2
          exit 1

      - name: Confirm the catalogue was seeded on start
        run: |
          set -eu
          COUNT="$(docker compose exec -T postgres psql -U ai_radar -d ai_radar -tAc 'select count(*) from sources')"
          echo "sources rows after web start: $COUNT"
          # A seed step that seeded nothing would otherwise look identical to one
          # that ran: floor the count rather than trust the exit status.
          [ "$COUNT" -gt 0 ] || { echo "the sources table is empty; the seed did not run" >&2; exit 1; }

      # The standalone server does not include public/ unless the image copies
      # it, and nothing else here would notice: pages render, the worker runs,
      # every other assertion passes while the icons, the offline page and the
      # service worker 404.
      #
      # It asserts a file that genuinely lives in public/. /manifest.webmanifest
      # is checked too, but it could NOT stand in for this: it is generated by
      # src/app/manifest.ts, a metadata route served by Next, so it answers 200
      # with public/ missing entirely.
      - name: Confirm static assets and the manifest are served
        run: |
          set -eu
          # Every path is checked and reported before the step decides, rather
          # than exiting on the first 404. When this fails it is a diagnosis:
          # public/ missing shows the two static files red and the generated
          # manifest still green, which is the difference between "the image
          # lost public/" and "the server is broken". Exiting early would hide
          # exactly the comparison that tells them apart.
          BAD=""
          for path in /icons/icon-192.png /offline.html /manifest.webmanifest; do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path" || true)"
            echo "GET $path -> $CODE"
            [ "$CODE" = "200" ] || BAD="$BAD $path"
          done
          if [ -n "$BAD" ]; then
            echo "expected 200 for:$BAD" >&2
            exit 1
          fi

      # Accepts exactly two outcomes and nothing else: a real pass once issue #5
      # lands, or today's explicit refusal. Silence, a crash or an empty exit 0
      # all fail. Written this way so #5 does not have to remember to edit it.
      - name: Run one worker pass
        run: |
          set -eu
          set +e
          # --once is load-bearing, not decoration. Issue #5 gives the worker a
          # loop mode and a one-pass mode, and the loop is the default the
          # compose service wants. Without this flag, the day that worker lands
          # this step stops exiting and hangs until the job timeout — and the
          # failure would look like #5's fault rather than this command's.
          # No longer a no-op: the worker exists and this flag is what makes it
          # run one pass and stop instead of looping forever.
          OUT="$(docker compose run --rm worker --once 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          echo "worker exit code: $CODE"
          if [ "$CODE" -eq 0 ]; then
            # Assert the SUMMARY, not the launch. "[worker] running one ingestion
            # pass" is printed by docker/worker-entrypoint.sh in the shell just
            # before it execs the worker, so it proves the bundle started and
            # nothing more: a pass skipped because another ingest holds the
            # advisory lock prints a different line, exits 0, and would land
            # here looking like a success. The "total:" line comes from
            # formatTotalLine and cannot be printed unless a pass completed.
            # [1-9] floors the source count, so a pass over zero sources — a
            # database that seeded nothing — fails here too.
            echo "$OUT" | grep -qE "^total: [1-9][0-9]* sources" \
              || { echo "worker exited 0 without completing a pass" >&2; exit 1; }
            echo "RESULT: the worker ran a pass."
          elif [ "$CODE" -eq 78 ]; then
            echo "$OUT" | grep -q "NOT IMPLEMENTED: this image contains no worker entry" \
              || { echo "worker exited 78 without saying why" >&2; exit 1; }
            echo "RESULT: no worker entry in this image yet (issue #5). Reported, not hidden."
          else
            echo "worker failed in an unexpected way (exit $CODE)" >&2
            exit 1
          fi

      - name: Show the logs if anything above failed
        if: failure()
        run: docker compose logs --no-color

      - name: Tear the stack down
        if: always()
        run: docker compose down -v --remove-orphans
