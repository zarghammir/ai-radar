name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref. On a pull request a new push cancels the previous run rather
# than paying for two answers to the same question. On main nothing is ever
# cancelled: two merges landing inside a run's ~70 seconds share the ref
# refs/heads/main, and cancelling there would leave the first commit with no
# verdict and no way to tell which merge broke a later red.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest

    # Available for any test that needs a real database. Tests that do not
    # touch it simply ignore DATABASE_URL.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ai_radar
          POSTGRES_PASSWORD: ai_radar
          POSTGRES_DB: ai_radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_radar -d ai_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ai_radar:ai_radar@localhost:5432/ai_radar_test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node and the npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # One source of truth for the Node version, shared with contributors.
          node-version-file: .nvmrc
          cache: npm

      # Node 22 ships npm 10, which cannot read this lockfile: npm 11 omits 27
      # nested entries that npm 10 expects, so it reports "Missing: esbuild@…".
      # The pin stays until the runner's bundled npm reaches 11. The exact
      # version comes from packageManager in package.json, so there is one
      # place to change it and it cannot drift from what contributors install.
      - name: Pin npm to the version in packageManager
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          echo "packageManager pins npm $NPM_VERSION"
          npm install -g "npm@${NPM_VERSION}"
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `typecheck` is `next typegen && tsc --noEmit`. The typegen half is not
      # decoration: LayoutProps and friends live in gitignored .next/types, so a
      # clean checkout cannot typecheck without it.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Built with no DATABASE_URL on purpose. `next build` imports every route
      # module to collect its page data, and src/db/client.ts throws without a
      # connection string, so a route that imports the client at the top of the
      # file fails any build that has no database — which is exactly what the
      # image build is. Catching it here costs seconds; the image build catches
      # it two minutes in, and only compose-smoke runs that.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ""

      # Last on purpose: a formatting nit must never be the reason a real
      # failure goes unseen.
      - name: Format check
        run: npm run format:check

  # The browser evidence. Three scripts in this repo measure things no other
  # check can see — and until this job existed, all of them ran only when a
  # person remembered, which means they were absent exactly when nobody was
  # looking.
  #
  # Runs on every pull request rather than on a path filter. A path filter would
  # have to guess which files can change a rendered page, and the honest answer
  # is most of them: a utility, a token, a layout, a dependency bump. A browser
  # check that runs only sometimes is the problem this job exists to fix. It
  # costs roughly 3-4 runner minutes a run; the schedule in ingest.yml is where
  # the minutes conversation actually belongs (see docs/cost-protection.md).
  #
  # `needs: ci` so a pull request that already fails lint, types, tests or the
  # build does not also pay for a browser.
  e2e:
    name: browser checks
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ai_radar
          POSTGRES_PASSWORD: ai_radar
          POSTGRES_DB: ai_radar_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_radar -d ai_radar_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ai_radar:ai_radar@localhost:5432/ai_radar_e2e
      NEXT_TELEMETRY_DISABLED: "1"
      # Both scripts default to this and take it as argv[2]; naming it once here
      # keeps the server and the scripts from drifting apart.
      VERIFY_URL: http://127.0.0.1:3210

    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node and the npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm to the version in packageManager
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      # No browser download. `playwright-core` ships none by design, and the
      # runner image already carries Google Chrome, which is what
      # scripts/lib/browser.mjs resolves through Playwright's "chrome" channel.
      # Printed rather than assumed: if this ever prints nothing, the scripts
      # below exit 2 and this job goes red saying the instrument could not run,
      # which is the correct outcome and not a skip.
      - name: Show the browser the scripts will drive
        run: |
          google-chrome --version || echo "no google-chrome on PATH"

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ""

      - name: Create the schema and load the catalogue
        run: |
          npm run db:migrate
          npm run db:seed

      # CONTROL, THROWAWAY BRANCH, NEVER MERGE. The server is deliberately NOT
      # started, and Chrome is left in place, so scripts/lib/browser.mjs exits 2
      # from requireServer rather than from launchBrowser. #49 proved the
      # no-browser cause; this proves the other one the job's message names.
      - name: CONTROL — do not start the server
        run: echo "no server on 127.0.0.1:3210, as intended"

      # Exit 2 from these scripts means THE INSTRUMENT COULD NOT RUN — no
      # browser, or nothing serving. That is a different state from "the checks
      # failed" (1) and from "the checks passed" (0), and it must never be
      # treated as a skip: a green tick for a run that measured nothing is the
      # failure this repository has catalogued more than any other.
      #
      # Both cases are red. They are separated only so the log says which
      # happened, because the fix is completely different.
      - name: Accessibility, overflow and bottom-bar sweep
        run: |
          set +e
          npm run a11y
          CODE=$?
          set -e
          case "$CODE" in
            0) echo "RESULT: the sweep ran and passed." ;;
            2)
              echo "::error::The accessibility sweep could NOT RUN — no browser could be resolved, or nothing was serving. This is not a pass and not a skip." >&2
              exit 1
              ;;
            *)
              echo "::error::The accessibility sweep RAN and FAILED (exit $CODE)." >&2
              exit "$CODE"
              ;;
          esac

      - name: The four checks axe cannot see
        run: |
          set +e
          npm run verify:shell
          CODE=$?
          set -e
          case "$CODE" in
            0) echo "RESULT: the shell verification ran and passed." ;;
            2)
              echo "::error::The shell verification could NOT RUN — no browser could be resolved, or nothing was serving. This is not a pass and not a skip." >&2
              exit 1
              ;;
            *)
              echo "::error::The shell verification RAN and FAILED (exit $CODE)." >&2
              exit "$CODE"
              ;;
          esac

      - name: Server log, if anything above failed
        if: failure()
        run: cat /tmp/next-server.log || true

      - name: Stop the server
        if: always()
        run: |
          [ -f /tmp/next-server.pid ] && kill "$(cat /tmp/next-server.pid)" 2>/dev/null || true

  # Proves the self-host path the README promises. The owner's Mac has no
  # Docker, so this job is the only place the image and the stack are ever
  # actually run.
  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    # A stack that never becomes healthy would otherwise sit here burning
    # minutes on a free-tier budget.
    timeout-minutes: 15

    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The quick start's first commands. If .env.example's defaults have drifted
      # out of step with the compose file, the stack fails here.
      #
      # The generated secret is part of the quick start, not a CI convenience:
      # since issue #5 the worker refuses to start while INTERNAL_API_SECRET is
      # the published placeholder, so a smoke that kept the placeholder would
      # test a path the README no longer tells anyone to take.
      - name: cp .env.example .env, then generate a real secret
        run: |
          cp .env.example .env
          sed -i "s|^INTERNAL_API_SECRET=.*|INTERNAL_API_SECRET=$(openssl rand -hex 32)|" .env
          # Assert what the value IS, not merely that it is not the placeholder:
          # if the sed ever matched nothing — a renamed key, a reordered
          # .env.example — the line would be absent entirely and a "not
          # change-me" check would pass on a file with no secret at all.
          if ! grep -qE '^INTERNAL_API_SECRET=[0-9a-f]{64}$' .env; then
            echo "INTERNAL_API_SECRET is not a 64-character hex secret; the worker would refuse to start" >&2
            grep -n '^INTERNAL_API_SECRET=' .env >&2 || echo "  (no INTERNAL_API_SECRET line at all)" >&2
            exit 1
          fi
          echo "INTERNAL_API_SECRET generated for the smoke"

      - name: Build the image
        run: docker compose build web

      - name: Report the image size
        run: |
          BYTES="$(docker image inspect ai-radar:local --format '{{.Size}}')"
          echo "image ai-radar:local = $((BYTES / 1024 / 1024)) MB ($BYTES bytes)"
          echo "IMAGE_MB=$((BYTES / 1024 / 1024))" >> "$GITHUB_ENV"

      - name: Boot postgres and web
        run: docker compose up -d --wait --wait-timeout 180 postgres web

      - name: Wait for web to answer 200
        run: |
          set -eu
          for i in $(seq 1 60); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)"
            if [ "$CODE" = "200" ]; then
              echo "web answered HTTP $CODE after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "web never answered 200; last code was '${CODE:-none}'" >&2
          exit 1

      - name: Confirm the catalogue was seeded on start
        run: |
          set -eu
          COUNT="$(docker compose exec -T postgres psql -U ai_radar -d ai_radar -tAc 'select count(*) from sources')"
          echo "sources rows after web start: $COUNT"
          # A seed step that seeded nothing would otherwise look identical to one
          # that ran: floor the count rather than trust the exit status.
          [ "$COUNT" -gt 0 ] || { echo "the sources table is empty; the seed did not run" >&2; exit 1; }

      # Accepts exactly two outcomes and nothing else: a real pass once issue #5
      # lands, or today's explicit refusal. Silence, a crash or an empty exit 0
      # all fail. Written this way so #5 does not have to remember to edit it.
      - name: Run one worker pass
        run: |
          set -eu
          set +e
          # --once is load-bearing, not decoration. Issue #5 gives the worker a
          # loop mode and a one-pass mode, and the loop is the default the
          # compose service wants. Without this flag, the day that worker lands
          # this step stops exiting and hangs until the job timeout — and the
          # failure would look like #5's fault rather than this command's.
          # No longer a no-op: the worker exists and this flag is what makes it
          # run one pass and stop instead of looping forever.
          OUT="$(docker compose run --rm worker --once 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          echo "worker exit code: $CODE"
          if [ "$CODE" -eq 0 ]; then
            # Assert the SUMMARY, not the launch. "[worker] running one ingestion
            # pass" is printed by docker/worker-entrypoint.sh in the shell just
            # before it execs the worker, so it proves the bundle started and
            # nothing more: a pass skipped because another ingest holds the
            # advisory lock prints a different line, exits 0, and would land
            # here looking like a success. The "total:" line comes from
            # formatTotalLine and cannot be printed unless a pass completed.
            # [1-9] floors the source count, so a pass over zero sources — a
            # database that seeded nothing — fails here too.
            echo "$OUT" | grep -qE "^total: [1-9][0-9]* sources" \
              || { echo "worker exited 0 without completing a pass" >&2; exit 1; }
            echo "RESULT: the worker ran a pass."
          elif [ "$CODE" -eq 78 ]; then
            echo "$OUT" | grep -q "NOT IMPLEMENTED: this image contains no worker entry" \
              || { echo "worker exited 78 without saying why" >&2; exit 1; }
            echo "RESULT: no worker entry in this image yet (issue #5). Reported, not hidden."
          else
            echo "worker failed in an unexpected way (exit $CODE)" >&2
            exit 1
          fi

      - name: Show the logs if anything above failed
        if: failure()
        run: docker compose logs --no-color

      - name: Tear the stack down
        if: always()
        run: docker compose down -v --remove-orphans
