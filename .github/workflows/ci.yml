name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref. On a pull request a new push cancels the previous run rather
# than paying for two answers to the same question. On main nothing is ever
# cancelled: two merges landing inside a run's ~70 seconds share the ref
# refs/heads/main, and cancelling there would leave the first commit with no
# verdict and no way to tell which merge broke a later red.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest

    # Available for any test that needs a real database. Tests that do not
    # touch it simply ignore DATABASE_URL.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ai_radar
          POSTGRES_PASSWORD: ai_radar
          POSTGRES_DB: ai_radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_radar -d ai_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ai_radar:ai_radar@localhost:5432/ai_radar_test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out the branch
        uses: actions/checkout@v7

      - name: Set up Node and the npm cache
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # The lockfile in this repo is written by npm 11. npm 10, which ships with
      # Node 22, computes a different tree for it and refuses `npm ci` with
      # "Missing: esbuild@0.28.2 from lock file". Reproduced on both: npm 10
      # exits 1 and npm 11 exits 0 against this same lockfile.
      - name: Pin npm to the version the lockfile was written with
        run: |
          npm install -g npm@11
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      # Next writes route helper types (LayoutProps, PageProps …) into
      # .next/types, which is gitignored. Without this step a clean checkout
      # cannot typecheck, and the failure looks like a real type error.
      - name: Generate Next route types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Last on purpose: a formatting nit must never be the reason a real
      # failure goes unseen.
      - name: Format check
        run: npm run format:check
