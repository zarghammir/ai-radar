name: Ingest

# DECLARES WHAT IT ACTUALLY DELIVERS. This said */30 — 48 runs a day — and
# GitHub never kept it: measured over the last 76 scheduled runs, 6.2 a day,
# median gap 3.87h, worst 8.09h. A declared rate nobody honours is not a
# harmless ceiling; it is the number the next person reads when they ask how
# fresh the app is, and every one of them was wrong by a factor of eight.
#
# 3 HOURS IS ALSO THE RIGHT NUMBER ON ITS OWN, independently of what GitHub
# will do with it. The catalogue produces about 30 new items a day — 1.3 an
# hour — so a half-hourly pass fetched 0.6 new items and spent a runner minute
# doing it. Every three hours is ~4 new items a pass: worth a run, and inside
# the daily summariser cap.
#
# Plus a manual button for when someone wants a brief refreshed now. This is
# the hosted alternative to leaving the worker container running: same entry,
# same single-writer lock, one pass per invocation.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Never two ingests at once, by two mechanisms that cover different failures.
#
# Here: a run arriving while one is going is QUEUED, not skipped — and if a
# third arrives while one is already pending, GitHub cancels the pending one so
# the newest takes its place. So at most one run ever waits and a backlog
# cannot build, which is the property that matters; it is not the same as
# skipping, and saying so matters because a queued run still costs a minute.
#
# And in the worker: if the queued run starts while the previous is somehow
# still working, the advisory lock in src/worker/lock.ts declines it and it
# exits 0 having done nothing. Belt and braces, because the schedule and the
# compose loop can both be running against one database.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  # Write because of the keepalive at the end of the job, which commits
  # nothing but an empty marker and only after 45 quiet days. Read is not
  # enough for the one thing that stops this workflow dying of old age.
  contents: write
  # The alarm opens and closes ONE issue. Ingestion failed 25+ consecutive runs
  # over four days and nothing told anyone; a red run is only a notification if
  # somebody opens the Actions tab.
  issues: write

jobs:
  ingest:
    name: one ingestion pass
    runs-on: ubuntu-latest
    # MEASURED, not estimated. The last successful pass before this was raised:
    # "18 sources, 586 fetched, 70 new, 68 stories in 739.3s" — run 36530616047,
    # 2026-09-29T06:21Z. The pass before it hit exactly 15:00 and was killed.
    #
    # The comment here used to say "a pass takes seconds against a warm
    # database". That was true once and had quietly stopped being true; 739s is
    # 82% of the budget it was reassuring us about.
    #
    # WHERE THE TIME GOES. Not the network. run.ts opens one transaction per
    # FETCHED item — insert, cluster, update, refresh — so the cost tracks items
    # rather than sources: 739.3s / 586 items = 1.26s each, and that run had
    # summaries switched off by the daily cap, so it is nearly all loop. Seeding
    # the seven sources that merged on 2026-09-22 adds roughly 200 items a pass,
    # which is ~250s on the steady path and considerably more on the first pass,
    # where every one of them is new and takes the expensive branch instead of
    # returning early as a duplicate.
    #
    # 30 rather than 20 because the projection is arithmetic on one run, and the
    # first seeded pass is the one furthest from it. Raising this is NOT the fix
    # — batching those per-item transactions is, and #182 holds the measurement.
    # This number exists to stop a hung job burning minutes, and at 30 it still
    # does; it was never meant to be the thing that caps a healthy pass.
    timeout-minutes: 30

    # ── What the worker can actually see ──────────────────────────────────
    #
    # EVERY VARIABLE THE WORKER READS IS PASSED HERE, INCLUDING THE OPTIONAL
    # ONES, and that is the fix for a defect that made two features
    # unswitchable in production rather than merely unconfigured.
    #
    # The summariser (#138) and push delivery (#146) are both optional by
    # design: absent key, feature off, app keeps running. But an optional
    # variable that the workflow never forwards is not optional — it is
    # ABSENT ALWAYS. Secrets were added to this repository and nothing
    # changed, because the process that reads them was never handed them.
    #
    # An unset secret expands to the empty string, which is exactly what
    # "absent" already means to the code, so forwarding them unconditionally
    # keeps the absent-stays-absent ruling intact and makes PRESENT reachable
    # for the first time.
    #
    # `npm run env:check` fails if this list and what the worker reads ever
    # drift apart again. Do not add an env read to the worker's import graph
    # without adding it here or declaring it absent in that script.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      NEXT_TELEMETRY_DISABLED: "1"

      # AI summaries (#138). Capped by LLM_MAX_STORIES_PER_DAY, which is
      # enforced in code and recorded in llm_usage.
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_MAX_STORIES_PER_DAY: ${{ secrets.LLM_MAX_STORIES_PER_DAY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}

      # The brief that arrives on its own (#146). THE SAME GAP HIT THESE and
      # nobody had noticed: push delivery could not be switched on in
      # production either, for the same reason and since it merged.

    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node and the npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Same reason as CI: Node 22 ships npm 10, which cannot read a lockfile
      # written by npm 11 and fails with "Missing: esbuild@…".
      - name: Pin npm to the version in packageManager
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      # Named here rather than left to fail inside the worker: a scheduled job
      # that goes red at 04:00 should say which secret is missing, not surface
      # it as a connection error.
      - name: Check the secrets this job needs are set
        run: |
          missing=""
          [ -n "${DATABASE_URL:-}" ] || missing="$missing DATABASE_URL"
          [ -n "${INTERNAL_API_SECRET:-}" ] || missing="$missing INTERNAL_API_SECRET"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing" >&2
            echo "Set them under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

      # Exit code: a single dead feed keeps this green on purpose. Every source
      # failing fails the job, because that is the worker, the network or the
      # database rather than one publisher having a bad morning.
      - name: Run one ingestion pass
        run: npm run worker:once

      # ── The keepalive ─────────────────────────────────────────────────────
      #
      # GITHUB DISABLES SCHEDULED WORKFLOWS IN A PUBLIC REPOSITORY AFTER 60
      # DAYS WITH NO REPOSITORY ACTIVITY, and it does so silently. Two quiet
      # months — no commits, because the app is finished and working — and the
      # collector stops. Nothing goes red, no issue opens, the alarm below
      # cannot fire because the job never runs. The reader simply finds stale
      # news, which is the failure this project is least able to detect.
      #
      # It lives INSIDE this job rather than in a workflow of its own for the
      # obvious reason: a separate scheduled keepalive is itself a scheduled
      # workflow and gets disabled by the same rule. Only something the
      # surviving schedule runs can keep the schedule alive.
      #
      # An empty commit, not a file that churns: it moves the repository's
      # activity clock without touching the tree, so no diff and no review.
      # At 45 days there are still 15 in hand if a run fails.
      #
      # `if: success()` on purpose. A repository whose ingestion is broken
      # should be allowed to go quiet and have its schedule disabled; keeping
      # a failing collector alive forever is not a service to anyone.
      - name: Keep the schedule from being disabled for inactivity
        if: success() && github.event_name == 'schedule'
        run: |
          set -euo pipefail
          LAST="$(git log -1 --format=%ct)"
          DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "days since the last commit: $DAYS"
          if [ "$DAYS" -lt 45 ]; then
            echo "  nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep the ingestion schedule alive" \
            -m "GitHub disables scheduled workflows in public repositories after 60 days without repository activity. This commit is that activity and nothing else; see the keepalive step in .github/workflows/ingest.yml."
          # Explicit refspec, not a bare `git push`: what checkout leaves in
          # HEAD and whether it has an upstream is checkout's business, not
          # ours, and a keepalive that silently fails to push is worse than
          # no keepalive. No force, so a race with a real commit loses and
          # the next scheduled run tries again.
          git push origin "HEAD:$GITHUB_REF_NAME"

      # ── The alarm ─────────────────────────────────────────────────────────
      # `always()` on purpose: the whole point is the failing case, and a step
      # that only runs on success cannot report a failure.
      #
      # ONE issue per outage, closed on recovery. Thirty failures making thirty
      # issues would train its reader to filter it, which is how a real one gets
      # missed — so the decision lives in .github/scripts/ingest-alarm.mjs,
      # whose --self-test drives all four cases including the two that must stay
      # SILENT. Those are the cases no manual test exercises.
      - name: Raise or clear the failure alarm
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Scheduled ingestion is failing"

          # NO `|| true`. I had one here with a comment claiming gh exits
          # non-zero when it finds nothing. MEASURED, with a control: `gh issue
          # list --json` exits 0 and prints empty when nothing matches, and
          # exits 0 with a number when something does. So the ordinary case
          # never needed rescuing, and the ONLY thing `|| true` could swallow
          # was a genuine failure — auth, rate limit, network.
          #
          # What that cost: on a swallowed error NUM is empty, OPEN=false, and
          # a failing run opens a DUPLICATE issue while one is already open —
          # every scheduled pass, for as long as the outage lasts. The exact
          # "thirty issues train the reader to ignore it" failure this design
          # exists to prevent, arriving through the error path.
          #
          # AN ALARM THAT CANNOT TELL WHETHER AN ISSUE IS OPEN MUST NOT GUESS
          # "NO". Without the guard, `set -euo pipefail` fails the step, which
          # is correct: fail closed and visibly.
          #
          # (I transferred this from #83, where `|| true` on a grep WAS
          # load-bearing because grep really does exit 1 on no match. A true
          # fact about one tool, applied to another without testing it.)
          NUM="$(gh issue list --state open --search "$TITLE in:title" \
                   --json number --jq '.[0].number // empty')"
          if [ -n "${NUM:-}" ]; then OPEN=true; else OPEN=false; fi

          ACTION="$(node .github/scripts/ingest-alarm.mjs --decide "$OUTCOME" "$OPEN")"
          echo "RESULT: outcome=$OUTCOME alarmOpen=$OPEN -> $ACTION"

          case "$ACTION" in
            open)
              BODY="$(printf '%s\n\n%s\n\n%s' \
                "The scheduled collector failed. One outage is one issue: this opens on the first failure and closes itself when a run succeeds." \
                "Run: $RUN_URL" \
                "Not a diagnosis. A per-source failure prints only the FIRST line of its error, so the database own words are in ingest_runs.error rather than in this log.")"
              gh issue create --title "$TITLE" --body "$BODY"
              ;;
            close)
              gh issue close "$NUM" --comment "A scheduled run succeeded: $RUN_URL"
              ;;
            nothing)
              echo "  nothing to do"
              ;;
            *)
              echo "::error::the alarm returned an unknown action '$ACTION'" >&2
              exit 1
              ;;
          esac
